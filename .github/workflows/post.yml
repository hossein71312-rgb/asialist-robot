name: Rubika Post
on:
  schedule:
    - cron: '30 6,14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test یا post'
        default: 'post'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: python post.py ${{ github.event.inputs.mode || 'post' }}
      - name: Save state
        if: ${{ (github.event.inputs.mode || 'post') == 'post' }}
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "state" || exit 0
          git push
