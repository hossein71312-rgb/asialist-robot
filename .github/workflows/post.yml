name: Rubika Post
on:
  schedule:
    - cron: '5,35 5-18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test یا post'
        default: 'post'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event_name == 'schedule' && 'post' || (github.event.inputs.mode == 'test' && 'test' || 'force') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: python post.py $MODE
      - name: Save state
        if: ${{ env.MODE != 'test' }}
        run: |
          [ -f state.json ] || exit 0
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "state" || exit 0
          git push
